<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página no encontrada · Álvaro Torres Baeza</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0e0f">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..400&family=Schibsted+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0e0f;--ink:#eef0e6;--muted:#9aa38a;--accent:#d4ec8e;--line:rgba(212,236,142,.22)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:32px 16px;background:var(--bg);color:var(--ink);font:400 17px/1.55 'Schibsted Grotesk',Arial,sans-serif;
    background-image:linear-gradient(rgba(212,236,142,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(212,236,142,.04) 1px,transparent 1px);background-size:40px 40px}
  main{width:min(640px,100%)}
  .mark{display:inline-grid;grid-template-columns:repeat(2,26px);grid-template-rows:repeat(2,26px);margin-bottom:36px;text-decoration:none}
  .mark span{display:grid;place-items:center;font:500 13px/1 'JetBrains Mono',monospace}
  .mark span:nth-child(1),.mark span:nth-child(4){background:var(--accent);color:var(--bg)}
  .mark span:nth-child(2),.mark span:nth-child(3){background:#20282c;color:var(--accent)}
  .term{font:400 15px/1.7 'JetBrains Mono',monospace;color:var(--muted);padding:16px 18px;border:1px solid var(--line);background:rgba(0,0,0,.25);overflow-wrap:anywhere}
  .term b{color:var(--accent);font-weight:500}
  .code{margin-top:36px;font:500 13px/1 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
  h1{margin-top:14px;font:380 clamp(38px,8vw,60px)/1.05 'Newsreader',Georgia,serif;letter-spacing:-.015em}
  h1 em{color:var(--accent)}
  p.txt{margin-top:16px;color:var(--muted);max-width:46ch}
  .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
  .btn{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;font:500 14px/1 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border:1px solid var(--accent);color:var(--accent);transition:background .2s,color .2s}
  .btn--main{background:var(--accent);color:var(--bg)}
  .btn:hover,.btn:focus-visible{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <a class="mark" href="/" aria-label="Inicio · Álvaro Torres Baeza"><span>A</span><span>J</span><span>T</span><span>B</span></a>
  <p class="term" aria-hidden="true"><b>&gt;</b> cd <span id="path">/</span><br>bash: no existe el archivo o el directorio</p>
  <p class="code">Error 404</p>
  <h1>Esta página <em>no existe.</em></h1>
  <p class="txt">Puede que el enlace esté mal escrito o que la página se haya movido. Todo lo demás sigue en su sitio.</p>
  <div class="actions">
    <a class="btn btn--main" href="/">Ir al inicio</a>
    <a class="btn" href="/#contacto">Contacto</a>
  </div>
</main>
<script>let p = location.pathname; try { p = decodeURIComponent(p); } catch (e) {} document.getElementById('path').textContent = p;</script>
</body>
</html>
